name: Build PrintManagement

on:
#   push:
#     branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Restore NuGet packages
      run: nuget restore PrintManagement.sln

    - name: Build solution
      run: msbuild PrintManagement.sln /p:Configuration=Release

    - name: Show build output
      run: dir PrintManagement/bin/Release/
